<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dsh-bazi icon source</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#edf4f1}
.icon{position:relative;width:512px;height:512px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:18px solid #fff;border-radius:64px}
.pillars{display:flex;gap:22px;align-items:center;margin:7px 0 23px}
.pillars i{display:block;width:43px;height:92px;border-radius:11px;background:#24804d}
.pillars i:nth-child(2){background:#c93232}.pillars i:nth-child(3){background:#94472b}.pillars i:nth-child(4){background:#c28e14}
.label{font:152px/1.15 "KaiTi","STKaiti","Microsoft YaHei",serif;letter-spacing:5px;color:#253441;margin-left:5px}
.rule{width:166px;height:7px;border-radius:10px;background:#246b60;margin-top:24px}
</style>
<main class="icon" aria-label="八字：四柱命盘与人生趋势">
  <div class="pillars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="label">八字</div><div class="rule" aria-hidden="true"></div>
</main>
</html>
